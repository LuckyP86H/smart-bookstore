name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel previous runs if a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN; jobs that need more request it explicitly
permissions:
  contents: read

jobs:
  backend-test:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        # Pinned to the same versions used in backend/Dockerfile
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Generate protobuf code
        working-directory: ./backend
        run: |
          mkdir -p gen
          protoc --proto_path=proto \
            --go_out=gen --go_opt=paths=source_relative \
            --connect-go_out=gen --connect-go_opt=paths=source_relative \
            proto/bookstore.proto

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run go fmt check
        working-directory: ./backend
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run tests
        working-directory: ./backend
        run: go test -race ./...

  frontend-test:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate protobuf code
        working-directory: ./frontend
        run: npm run generate

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build (includes type check)
        working-directory: ./frontend
        run: npm run build

  ai-service-test:
    name: AI Service (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install test dependencies
        # The unit tests stub torch/litellm/psycopg2, so the multi-GB ML stack
        # is not installed here; the full requirements.txt is exercised by the
        # docker-build job below.
        working-directory: ./ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ./ai-service
        run: pytest -v

  # Ensures all Dockerfiles build (including the full AI dependency stack)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: bookstore-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: bookstore-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI service image
        uses: docker/build-push-action@v7
        with:
          context: ./ai-service
          push: false
          tags: bookstore-ai-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for the SARIF upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        # SHA-pinned (v0.36.0) so upstream tag moves can't change CI code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Single required status check for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test, docker-build, security-scan]
    if: always()

    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"
