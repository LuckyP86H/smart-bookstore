name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel previous runs if a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend Go tests
  backend-test:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: backend/go.sum

      - name: Install protoc
        run: |
          PROTOC_VERSION=33.4
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local 'include/*'
          rm protoc-${PROTOC_VERSION}-linux-x86_64.zip
          protoc --version

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

      - name: Generate protobuf code
        working-directory: ./backend
        run: |
          mkdir -p gen
          protoc --proto_path=proto \
            --go_out=gen --go_opt=paths=source_relative \
            --connect-go_out=gen --connect-go_opt=paths=source_relative \
            proto/bookstore.proto proto/ai.proto

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...
      
      - name: Run go fmt check
        working-directory: ./backend
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -s -l .
            exit 1
          fi
      
      - name: Build backend
        working-directory: ./backend
        run: go build -v ./...
      
      # Uncomment when you add tests
      # - name: Run tests
      #   working-directory: ./backend
      #   run: go test -v -race -coverprofile=coverage.out ./...
      
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./backend/coverage.out
      #     flags: backend

  # Frontend TypeScript/React tests
  frontend-test:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install protoc
        run: |
          PROTOC_VERSION=33.4
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local 'include/*'
          rm protoc-${PROTOC_VERSION}-linux-x86_64.zip
          protoc --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate protobuf code
        working-directory: ./frontend
        run: |
          mkdir -p src/gen
          protoc --proto_path=../backend/proto \
            --plugin=protoc-gen-es=./node_modules/.bin/protoc-gen-es \
            --plugin=protoc-gen-connect-es=./node_modules/.bin/protoc-gen-connect-es \
            --es_out=src/gen --es_opt=target=ts \
            --connect-es_out=src/gen --connect-es_opt=target=ts \
            ../backend/proto/bookstore.proto ../backend/proto/ai.proto

      - name: TypeScript type check
        working-directory: ./frontend
        run: npm run type-check || npx tsc --noEmit
      
      - name: Lint
        working-directory: ./frontend
        run: npm run lint || echo "Lint not configured, skipping"
        continue-on-error: true
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      # Uncomment when you add tests
      # - name: Run tests
      #   working-directory: ./frontend
      #   run: npm test -- --coverage
      
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./frontend/coverage/lcov.info
      #     flags: frontend

  # AI Service Python tests
  ai-service-test:
    name: AI Service Tests (Python)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      
      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Python syntax
        working-directory: ./ai-service
        run: python -m py_compile $(find . -name "*.py" -not -path "./venv/*")
      
      # Uncomment when you add tests
      # - name: Run tests
      #   working-directory: ./ai-service
      #   run: pytest --cov=app --cov-report=xml
      
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./ai-service/coverage.xml
      #     flags: ai-service

  # Docker build test (ensures all Dockerfiles are valid)
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: bookstore-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: bookstore-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: bookstore-ai-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration tests (optional, runs on main branch only)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Run integration tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: bookstore_test
        run: |
          echo "Integration tests would run here"
          # go test -v -tags=integration ./...

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Success summary
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test, docker-build, security-scan]
    if: always()
    
    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.ai-service-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"
