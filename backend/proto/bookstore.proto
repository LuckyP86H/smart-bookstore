syntax = "proto3";

package bookstore.v1;

option go_package = "github.com/LuckyP86H/smart-bookstore/gen;bookstorev1";

// ============================================================================
// Enums
// ============================================================================

enum Genre {
  GENRE_UNSPECIFIED = 0;
  FICTION = 1;
  NON_FICTION = 2;
  SCIENCE = 3;
  HISTORY = 4;
  BIOGRAPHY = 5;
  MYSTERY = 6;
  ROMANCE = 7;
  FANTASY = 8;
  SCIENCE_FICTION = 9;
  THRILLER = 10;
  HORROR = 11;
  SELF_HELP = 12;
  BUSINESS = 13;
  TECHNOLOGY = 14;
  CHILDREN = 15;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  PRICE_ASC = 1;
  PRICE_DESC = 2;
  TITLE_ASC = 3;
  TITLE_DESC = 4;
  RATING_DESC = 5;
  PUBLICATION_YEAR_DESC = 6;
}

// ============================================================================
// Core Messages
// ============================================================================

message Book {
  int64 id = 1;
  int64 store_id = 2;
  string isbn = 3;
  string title = 4;
  string author = 5;
  Genre genre = 6;
  string publisher = 7;
  int32 publication_year = 8;
  int32 page_count = 9;
  string language = 10;
  string cover_image_url = 11;
  string description = 12;
  double price = 13;
  int32 stock_quantity = 14;
  int32 total_sold = 15;
  double average_rating = 16;
  string created_at = 17;
  string store_name = 18;
  // Route B P4 (additive): synthetic-fixture disclosure (plan §4.4). True
  // for seed/demo listings; the UI labels them instead of presenting them
  // as real inventory. The Go backend predates the flag and leaves it
  // false — a documented divergence, like GetWork below.
  bool is_synthetic = 19;
}

message Review {
  int64 id = 1;
  int64 book_id = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  int32 rating = 5;
  string review_text = 6;
  string created_at = 7;
}

message Sale {
  int64 id = 1;
  int64 book_id = 2;
  string book_title = 3;
  int64 customer_id = 4;
  string customer_name = 5;
  int32 quantity = 6;
  double price_at_purchase = 7;
  string purchased_at = 8;
}

// ============================================================================
// Merchant Service Messages
// ============================================================================

message AddBookRequest {
  string isbn = 1;
  string title = 2;
  string author = 3;
  Genre genre = 4;
  string publisher = 5;
  int32 publication_year = 6;
  int32 page_count = 7;
  string language = 8;
  string cover_image_url = 9;
  string description = 10;
  double price = 11;
  int32 stock_quantity = 12;
}

message AddBookResponse {
  Book book = 1;
}

message RemoveBookRequest {
  int64 book_id = 1;
}

message RemoveBookResponse {
  string message = 1;
}

message UpdateStockRequest {
  int64 book_id = 1;
  int32 quantity_to_add = 2;
}

message UpdateStockResponse {
  Book book = 1;
}

message GetMerchantBooksRequest {
  bool include_sold_out = 1;
}

message GetMerchantBooksResponse {
  repeated Book books = 1;
}

message GetSoldBooksRequest {
  // Optional RFC 3339 bounds, e.g. "2026-01-02T15:04:05Z". Leave either
  // empty to leave that side of the range open; send neither for all sales.
  string start_date = 1;
  string end_date = 2;
}

message GetSoldBooksResponse {
  repeated Sale sales = 1;
}

message GetLowStockBooksRequest {
  int32 threshold = 1;
}

message GetLowStockBooksResponse {
  repeated Book books = 1;
}

// ============================================================================
// Customer Service Messages
// ============================================================================

message GetAvailableBooksRequest {
  string search_query = 1;
  Genre genre_filter = 2;
  string author_filter = 3;
  double min_price = 4;
  double max_price = 5;
  SortOrder sort_order = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message GetAvailableBooksResponse {
  repeated Book books = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetBookDetailsRequest {
  int64 book_id = 1;
}

message GetBookDetailsResponse {
  Book book = 1;
}

message PurchaseBookRequest {
  int64 book_id = 1;
  int32 quantity = 2;
}

message PurchaseBookResponse {
  string message = 1;
  Sale sale = 2;
}

message CartItem {
  int64 book_id = 1;
  int32 quantity = 2;
}

message CheckoutCartRequest {
  repeated CartItem items = 1;
}

message CheckoutCartResponse {
  string message = 1;
  repeated Sale sales = 2;
}

message AddReviewRequest {
  int64 book_id = 1;
  int32 rating = 2;
  string review_text = 3;
}

message AddReviewResponse {
  Review review = 1;
}

message GetBookReviewsRequest {
  int64 book_id = 1;
}

message GetBookReviewsResponse {
  repeated Review reviews = 1;
}

message GetPurchaseHistoryRequest {}

message GetPurchaseHistoryResponse {
  repeated Sale purchases = 1;
}

// ============================================================================
// Work Pages (Route B P4, plan §8 — Worker-only)
//
// GetWork is the identity layer's first read surface. It is implemented
// ONLY by the Cloudflare Worker: Go parity stays frozen at the P3
// surface (plan §12 decision 8), so the Go backend does not serve this
// RPC and its generated stubs must never be called. The divergence is
// recorded in DEPLOY.md.
// ============================================================================

message GetWorkRequest {
  // Identify the work by one of its listings (the frontend only ever
  // holds listing ids) or by the projection work id directly. book_id
  // wins when both are set.
  int64 book_id = 1;
  int64 work_id = 2;
}

// One store's offer of the work (a member listing, via listing_links).
message WorkOffer {
  int64 listing_id = 1;
  int64 store_id = 2;
  string store_name = 3;
  string isbn = 4;
  double price = 5;
  int32 stock_quantity = 6;
  double average_rating = 7;
  int32 total_sold = 8;
  // The ref_editions id this listing is linked to (0 when the link is
  // work-only or the work is local).
  int64 edition_id = 9;
  bool is_synthetic = 10;
}

// One published form of the work, from the reference catalogue.
message WorkEdition {
  int64 edition_id = 1;
  string title = 2;
  string publisher = 3;
  int32 publish_year = 4;
  string language = 5;
  int32 page_count = 6;
  string isbn13 = 7;
}

// A review of one member listing, rolled up onto the work (§8: reviews
// roll up through current membership). The Review message names the
// reviewer; the fields here add the listing it was written about, the
// store selling that listing, and the edition the listing is linked to
// — so "great translation" and "bad printing" stay distinguishable.
message WorkReview {
  Review review = 1;
  int64 listing_id = 2;
  string store_name = 3;
  int64 edition_id = 4;
}

message GetWorkResponse {
  // The projection row id (works.id).
  int64 work_id = 1;
  // Exactly one of these is set: the reference work, or the local work
  // for residue listings.
  int64 work_ref_id = 2;
  int64 local_work_id = 3;
  string title = 4;
  string author_display = 5;
  repeated string categories = 6;
  string summary_en = 7;
  string summary_zh = 8;
  repeated WorkOffer offers = 9;
  repeated WorkEdition editions = 10;
  repeated WorkReview reviews = 11;
  // Aggregates with exact denominators (§8): review_count is the number
  // of member reviews mean_rating averages over; the price spread is
  // over all member offers (0/0 when there are none).
  int32 review_count = 12;
  double mean_rating = 13;
  double min_price = 14;
  double max_price = 15;
  // True when any member listing is a synthetic fixture — the page must
  // disclose demo data (§4.4), never present it as real social proof.
  bool has_synthetic_listings = 16;
}

// ============================================================================
// Google Books API Integration
// ============================================================================

message LookupBookByISBNRequest {
  string isbn = 1;
}

message LookupBookByISBNResponse {
  string title = 1;
  string author = 2;
  string publisher = 3;
  int32 publication_year = 4;
  int32 page_count = 5;
  string description = 6;
  string cover_image_url = 7;
  repeated string categories = 8;
  // Route B P4 (additive), the §4.6 data rule made visible to the form:
  // which source produced this prefill — "local_index", "open_library" or
  // "google_books" — plus the attribution line to show next to it. When
  // the source is Google Books, the description and cover are TRANSIENT:
  // the form may display them with attribution but must not submit them
  // to AddBook (Google APIs Terms §5(e) forbids persisting them). The
  // *_transient flags say exactly that, per field.
  string source = 9;
  string attribution = 10;
  bool description_transient = 11;
  bool cover_transient = 12;
}

// ============================================================================
// Services
// ============================================================================

service MerchantService {
  // Book Management
  rpc AddBook(AddBookRequest) returns (AddBookResponse);
  rpc RemoveBook(RemoveBookRequest) returns (RemoveBookResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  
  // Inventory Queries
  rpc GetMerchantBooks(GetMerchantBooksRequest) returns (GetMerchantBooksResponse);
  rpc GetSoldBooks(GetSoldBooksRequest) returns (GetSoldBooksResponse);
  rpc GetLowStockBooks(GetLowStockBooksRequest) returns (GetLowStockBooksResponse);
  
  // External API. Public (no auth) so the add-book form can be prefilled;
  // accepts ISBN-10 or ISBN-13, hyphens and spaces allowed.
  rpc LookupBookByISBN(LookupBookByISBNRequest) returns (LookupBookByISBNResponse);
}

service CustomerService {
  // Browse and Search
  rpc GetAvailableBooks(GetAvailableBooksRequest) returns (GetAvailableBooksResponse);
  rpc GetBookDetails(GetBookDetailsRequest) returns (GetBookDetailsResponse);
  
  // Purchase Operations
  rpc PurchaseBook(PurchaseBookRequest) returns (PurchaseBookResponse);
  rpc CheckoutCart(CheckoutCartRequest) returns (CheckoutCartResponse);
  
  // Reviews
  rpc AddReview(AddReviewRequest) returns (AddReviewResponse);
  rpc GetBookReviews(GetBookReviewsRequest) returns (GetBookReviewsResponse);
  
  // Purchase History
  rpc GetPurchaseHistory(GetPurchaseHistoryRequest) returns (GetPurchaseHistoryResponse);

  // Work Pages (Route B P4, plan §8). Worker-only: the Go backend does
  // not implement this RPC (Go parity is frozen at the P3 surface).
  rpc GetWork(GetWorkRequest) returns (GetWorkResponse);
}
