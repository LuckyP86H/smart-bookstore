# Nginx configuration for React Single Page Application
# This ensures that client-side routing works correctly
server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1000;

    # Serve static files directly
    location / {
        # Try to serve file directly, fallback to index.html
        # This is critical for React Router - all routes serve index.html
        # and React handles the routing on the client side
        try_files $uri $uri/ /index.html;
        
        # Add cache headers for static assets
        add_header Cache-Control "public, max-age=31536000" always;
    }

    # Don't cache index.html to ensure users get latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
